<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2a1a08">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>龍山派 曾氏族譜 · 立體世系祠堂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --fs:1;
    --ink:#1a0f00; --gold:#b8860b; --gold-l:#e2bd62; --red:#8b1a1a; --paper:#ece0c4;
    --font:'Noto Serif TC','Songti TC','PMingLiU',serif;
    --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--paper);font-family:var(--font);color:var(--ink);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  /* 標題 */
  #title{position:fixed;top:calc(var(--st) + 14px);left:16px;pointer-events:none;z-index:5}
  #title h1{font-size:20px;font-weight:900;color:var(--red);letter-spacing:.25em}
  #title p{font-size:11px;color:#7a5a2a;letter-spacing:.3em;margin-top:2px}
  #genTag{position:fixed;top:calc(var(--st) + 14px);right:16px;z-index:5;pointer-events:none;
    writing-mode:vertical-rl;font-weight:900;font-size:18px;letter-spacing:.3em;color:var(--gold);
    background:rgba(42,26,8,.82);padding:10px 6px;border:1px solid var(--gold);border-radius:3px;opacity:0;transition:opacity .4s}
  #genTag.on{opacity:1}

  /* 印章 */
  #seal{position:fixed;right:14px;bottom:calc(var(--sb) + 36px + 40px * var(--fs));z-index:5;pointer-events:none;
    width:58px;height:58px;border:3px solid #a82020;border-radius:4px;color:#a82020;
    display:flex;align-items:center;justify-content:center;transform:rotate(-6deg);
    font-weight:900;font-size:13px;line-height:1.15;text-align:center;background:rgba(236,224,196,.55)}

  /* 底部工具列 */
  #bar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 10px calc(var(--sb) + 10px);
    background:linear-gradient(to top,rgba(42,26,8,.92),rgba(42,26,8,.75));border-top:1px solid var(--gold);
    display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  #bar::-webkit-scrollbar{display:none}
  #bar button{flex:0 0 auto;min-width:38px;min-height:calc(40px * var(--fs));padding:0 10px;border:1px solid #8b6020;border-radius:3px;
    background:#3d2006;color:var(--gold-l);font-family:var(--font);font-size:calc(15px * var(--fs));font-weight:700;cursor:pointer}
  #bar button.on{background:var(--gold);color:#2a1505;border-color:var(--gold-l)}
  #bar .sep{flex:0 0 1px;background:#8b6020;margin:4px 2px}

  /* 資料卡 */
  #card{position:fixed;left:50%;bottom:calc(var(--sb) + 34px + 40px * var(--fs));z-index:7;width:min(92vw,360px);
    transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:all .35s ease;
    background:linear-gradient(170deg,#faf3e0,#ede0b8);border:2px solid var(--gold);border-radius:4px;
    box-shadow:0 0 0 4px rgba(61,32,6,.85),0 10px 30px rgba(0,0,0,.45);padding:16px 18px 14px}
  #card.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  #card .hd{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid #c9a045;padding-bottom:8px;margin-bottom:8px}
  #card .nm{font-size:calc(26px * var(--fs));font-weight:900;color:var(--red);letter-spacing:.12em}
  #card .gn{font-size:calc(13px * var(--fs));color:#7a5a2a;letter-spacing:.2em}
  #card .tg{font-size:calc(12px * var(--fs));color:#faf3e0;background:var(--red);padding:2px 8px;border-radius:2px;margin-left:auto}
  #card dl{display:grid;grid-template-columns:4.2em 1fr;row-gap:6px;font-size:calc(15px * var(--fs))}
  #card dt{color:#7a5a2a}
  #card dd{color:var(--ink);font-weight:700}
  #card{max-height:62vh;overflow-y:auto}
  #card .av{width:44px;height:54px;object-fit:cover;border:2px solid var(--gold);border-radius:2px;align-self:center}
  #card .bio{margin-top:10px;padding-top:8px;border-top:1px dashed #c9a045;font-size:calc(14px * var(--fs));line-height:1.75;color:#3d2b1a;white-space:pre-wrap}
  #card .btns{display:flex;gap:8px;margin-top:12px}
  #card .tw{flex:1;min-height:calc(38px * var(--fs));border:1px solid var(--gold);border-radius:3px;background:#f3e3b8;color:#5a0d0d;font-family:var(--font);font-size:calc(15px * var(--fs));font-weight:700;letter-spacing:.15em;cursor:pointer}
  #card .flip{flex:2;min-height:calc(38px * var(--fs));border:1px solid var(--gold);border-radius:3px;background:#3d2006;color:var(--gold-l);font-family:var(--font);font-size:calc(15px * var(--fs));font-weight:700;letter-spacing:.2em;cursor:pointer}
  #card dd{word-break:break-all}
  #card.mini dl,#card.mini .bio{display:none}
  #card.mini .hd{border-bottom:0;margin-bottom:0}
  #card .x{position:absolute;top:6px;right:8px;border:0;background:none;font-size:calc(22px * var(--fs));color:#7a5a2a;cursor:pointer;padding:4px}

  /* 開場卷軸 */
  #intro{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at center,#3d2006,#1a0d03);
    display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .9s}
  #intro.hide{opacity:0;pointer-events:none}
  .scroll{display:flex;flex-direction:column;align-items:center}
  .rod{width:min(62vw,250px);height:16px;border-radius:8px;
    background:linear-gradient(to bottom,#7a4a1a,#c99a3a 40%,#5a3010);box-shadow:0 3px 8px rgba(0,0,0,.6);position:relative}
  .rod::before,.rod::after{content:'';position:absolute;top:-3px;width:14px;height:22px;border-radius:4px;background:#d4a843}
  .rod::before{left:-10px}.rod::after{right:-10px}
  .paper{width:min(56vw,224px);height:0;overflow:hidden;animation:unroll 1.8s .3s cubic-bezier(.6,.05,.3,1) forwards;
    background:linear-gradient(170deg,#faf3e0,#ede0b8);border-left:2px solid var(--gold);border-right:2px solid var(--gold);
    display:flex;align-items:center;justify-content:center;position:relative}
  @keyframes unroll{to{height:min(60vh,440px)}}
  .paper .ttl{writing-mode:vertical-rl;font-size:clamp(28px,8vw,40px);font-weight:900;color:var(--red);letter-spacing:.35em;line-height:1.6}
  .paper .sub{position:absolute;bottom:18px;left:18px;writing-mode:vertical-rl;font-size:12px;color:#7a5a2a;letter-spacing:.3em}
  .paper .stamp{position:absolute;bottom:20px;right:16px;width:40px;height:40px;border:2px solid #a82020;color:#a82020;
    font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1}
  #intro .hint{margin-top:22px;color:#c9a045;font-size:13px;letter-spacing:.4em;opacity:.8}
  #intro .err{margin-top:14px;color:#ffb0a0;font-size:13px;max-width:80vw;text-align:center;display:none}

  /* 祭祀 */
  #riteBanner{position:fixed;left:50%;top:calc(var(--st) + 64px);transform:translateX(-50%);z-index:6;display:none;cursor:pointer;
    background:linear-gradient(90deg,#5a0d0d,#8b1a1a,#5a0d0d);border:1px solid var(--gold-l);border-radius:3px;padding:7px 16px;text-align:center;
    box-shadow:0 0 18px rgba(255,190,80,.55);max-width:86vw}
  #riteBanner.on{display:block;animation:glow 2.4s ease-in-out infinite}
  @keyframes glow{50%{box-shadow:0 0 30px rgba(255,200,90,.9)}}
  #riteBanner b{display:block;color:#f6d98a;font-size:calc(15px * var(--fs));letter-spacing:.12em}
  #riteBanner span{display:block;color:#f3e3b8;font-size:calc(12px * var(--fs));margin-top:2px}
  #toast{position:fixed;left:50%;top:calc(var(--st) + 128px);transform:translate(-50%,-10px);z-index:40;opacity:0;pointer-events:none;transition:all .3s;
    background:rgba(42,26,8,.92);color:var(--gold-l);border:1px solid var(--gold);padding:9px 16px;border-radius:3px;font-size:calc(14px * var(--fs));max-width:88vw;text-align:center}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  .dlg{position:fixed;inset:0;z-index:35;background:rgba(20,10,2,.7);display:none;align-items:center;justify-content:center;padding:20px}
  .dlg.on{display:flex}
  .dlg .in{width:min(90vw,360px);background:linear-gradient(170deg,#faf3e0,#ede0b8);border:2px solid var(--gold);border-radius:4px;padding:18px;box-shadow:0 0 0 4px rgba(61,32,6,.85)}
  .dlg h4{color:var(--red);font-size:calc(17px * var(--fs));font-weight:900;margin-bottom:12px;letter-spacing:.08em}
  .dlg input{width:100%;font-family:var(--font);font-size:calc(16px * var(--fs));padding:9px 10px;border:1px solid #c9a045;border-radius:3px;background:#fffaf0;margin-bottom:10px;-webkit-user-select:text;user-select:text}
  .dlg .row{display:flex;gap:8px;flex-wrap:wrap}
  .dlg button{flex:1;min-width:80px;min-height:calc(40px * var(--fs));font-family:var(--font);font-size:calc(15px * var(--fs));font-weight:700;border-radius:3px;border:1px solid var(--gold);background:#3d2006;color:var(--gold-l)}
  .dlg button.no{background:#f3e3b8;color:#5a0d0d}
  #offerBox .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  #offerBox .grid button{height:auto;min-height:74px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:#fbf4e2;color:#5a0d0d;border:1px solid #c9a045}
  #offerBox .grid button b{font-size:calc(19px * var(--fs));letter-spacing:.3em;color:#8b1a1a}
  #offerBox .grid button small{font-size:calc(11px * var(--fs));font-weight:400;color:#7a5a2a}
  #offerBox .grid button em{font-style:normal;font-size:calc(11px * var(--fs));color:#fff;background:#8b1a1a;border-radius:2px;padding:0 6px}
  #offerBox .hint{font-size:calc(12px * var(--fs));color:#7a5a2a;margin:-6px 0 10px}
  #offerBox .grid .of-incense{grid-column:1 / -1}
  #offerBox .grid button{position:relative;transition:background .15s,border-color .15s}
  #offerBox .grid button i{position:absolute;top:7px;right:7px;width:18px;min-height:calc(18px * var(--fs));border:1.5px solid #c9a045;border-radius:3px;background:#fff}
  #offerBox .grid button.sel{background:#8b1a1a;border-color:#8b1a1a}
  #offerBox .grid button.sel b,#offerBox .grid button.sel small{color:#f6d98a}
  #offerBox .grid button.sel i{background:#f6d98a;border-color:#f6d98a}
  #offerBox .grid button.sel i::after{content:'';position:absolute;left:5px;top:1px;width:5px;min-height:calc(10px * var(--fs));border:solid #8b1a1a;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
  #offerBox .row .go{flex:2;background:#8b1a1a;border-color:#8b1a1a;color:#f6d98a;letter-spacing:.15em}
  #offerBox .row .go:disabled{opacity:.45}
  #offerBox .chant{width:100%;margin-top:10px;min-height:calc(44px * var(--fs));font-family:var(--font);font-size:calc(15px * var(--fs));font-weight:900;letter-spacing:.15em;border:1px solid #6b4a1a;border-radius:3px;background:linear-gradient(90deg,#2a1a08,#4a2e10,#2a1a08);color:#f6d98a}
  #offerBox .evy{width:100%;margin-top:10px;min-height:calc(40px * var(--fs));font-family:var(--font);font-size:calc(14px * var(--fs));font-weight:700;letter-spacing:.1em;border:1px dashed #8b1a1a;border-radius:3px;background:#fff8ec;color:#8b1a1a}
  #offerBox .row .all{background:#fbf4e2;color:#5a0d0d}
  #recBox .tm{text-align:center;font-size:calc(20px * var(--fs));font-weight:900;color:#5a0d0d;margin:6px 0 10px;letter-spacing:.1em}
  #recBox audio{width:100%;margin-bottom:10px;display:none}
  #recBox .stop,#recBox .redo,#recBox .ok{display:none}
  #recBox[data-st="rec"] .go,#recBox[data-st="done"] .go,#recBox[data-st="up"] .go{display:none}
  #recBox[data-st="rec"] .stop{display:block;background:#8b1a1a}
  #recBox[data-st="rec"] .tm{color:#c0392b}
  #recBox[data-st="done"] .redo,#recBox[data-st="done"] .ok{display:block}
  #recBox[data-st="done"] audio{display:block}
  #card .voices h5{font-size:calc(13px * var(--fs));color:#7a5a2a;margin:10px 0 4px;letter-spacing:.2em}
  #card .vrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed #d9c48a}
  #card .vrow span{flex:1;display:flex;flex-direction:column}
  #card .vrow b{font-size:calc(14px * var(--fs));color:#2a1a08}
  #card .vrow small{font-size:calc(12px * var(--fs));color:#7a5a2a}
  #card .vplay{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);background:#3d2006;color:var(--gold-l);font-size:13px}
  #card .vplay.on{background:var(--gold);color:#3d2006}
  #card .vdel{font-family:var(--font);font-size:calc(12px * var(--fs));border:0;background:none;color:#8b1a1a;text-decoration:underline}
  #card .inc{flex:1;min-height:calc(38px * var(--fs));border:1px solid #8b1a1a;border-radius:3px;background:#8b1a1a;color:#f6d98a;font-family:var(--font);font-size:calc(15px * var(--fs));font-weight:900;letter-spacing:.2em}
  #card .chn{flex:1;min-height:calc(38px * var(--fs));border:1px solid #6b4a1a;border-radius:3px;background:#2a1a08;color:#f6d98a;font-family:var(--font);font-size:calc(14px * var(--fs));font-weight:900;letter-spacing:.1em}
  #card .ofr{flex:1;min-height:calc(38px * var(--fs));border:1px solid #8b1a1a;border-radius:3px;background:#fbefd8;color:#8b1a1a;font-family:var(--font);font-size:calc(15px * var(--fs));font-weight:900;letter-spacing:.2em}
  #card .rec{flex:1;min-height:calc(38px * var(--fs));border:1px solid var(--gold);border-radius:3px;background:#f3e3b8;color:#5a0d0d;font-family:var(--font);font-size:calc(15px * var(--fs));font-weight:700;letter-spacing:.1em}
  .rstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 12px}
  .rstat div{background:#fbf4e2;border:1px solid #c9a045;border-radius:3px;text-align:center;padding:8px 0}
  .rstat b{display:block;font-size:calc(24px * var(--fs));color:#8b1a1a}.rstat small{font-size:calc(12px * var(--fs));color:#7a5a2a}
  .rbtn{width:100%;min-height:calc(44px * var(--fs));font-family:var(--font);font-size:calc(16px * var(--fs));font-weight:900;letter-spacing:.2em;border:1px solid #8b1a1a;background:#8b1a1a;color:#f6d98a;border-radius:3px}
  .rrow{display:flex;align-items:baseline;gap:8px;padding:8px 2px;border-bottom:1px dashed #d9c48a;font-size:calc(15px * var(--fs));cursor:pointer}
  .rrow b{color:#2a1a08;white-space:nowrap}.rrow span{flex:1;color:#5a3a10;font-size:calc(14px * var(--fs))}.rrow em{font-style:normal;font-size:calc(12px * var(--fs));color:#7a5a2a;white-space:nowrap}
  .rrow em.hot{color:#fff;background:#8b1a1a;padding:1px 6px;border-radius:2px}
  .rbtn.revery{margin-top:8px;background:#fff8ec;color:#8b1a1a;border:1px solid #8b1a1a}
  .rbtn.rchant{margin-top:8px;background:linear-gradient(90deg,#2a1a08,#4a2e10,#2a1a08);border-color:#6b4a1a}
  .rtoday{font-size:calc(14px * var(--fs))!important;text-align:center;color:#5a3a10!important;margin:0 0 10px!important}
  .rnote{font-size:calc(12px * var(--fs))!important;color:#7a5a2a!important;margin-top:12px}

  /* 念經 */
  #sutra{position:fixed;left:0;right:0;bottom:0;top:34vh;z-index:28;display:none;padding:0 8px calc(var(--sb) + 8px)}
  #sutra.on{display:block;animation:fadeIn .35s}
  #sutra .sheet{position:relative;height:100%;display:flex;flex-direction:column;background:linear-gradient(170deg,#1c1208,#0e0904);border:1px solid var(--gold);border-bottom:0;border-radius:6px 6px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.55);padding:14px 14px 10px}
  #sutra h3{color:var(--gold-l);font-size:calc(17px * var(--fs));font-weight:900;letter-spacing:.12em;text-align:center;margin:0 26px 10px}
  #sutra .x{position:absolute;top:6px;right:8px;border:0;background:none;color:#c9a045;font-size:calc(26px * var(--fs));padding:4px 8px}
  #sutra .opt{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  #sutra .opt span{display:flex;border:1px solid #6b4a1a;border-radius:3px;overflow:hidden}
  #sutra .opt button{font-family:var(--font);font-size:calc(13px * var(--fs));padding:5px 9px;border:0;background:#2a1a08;color:#c9a045}
  #sutra .opt button.on{background:var(--gold);color:#2a1505;font-weight:900}
  #sutra .prog{height:3px;background:#3d2b14;border-radius:2px;margin-bottom:8px;overflow:hidden}
  #sutra .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b8862b,#f6d98a);transition:width .3s}
  #sutra .txt{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 4px 30vh;font-size:calc(24px * var(--fs));line-height:2.05;letter-spacing:.14em;color:#7d6a4a;text-align:justify}
  #sutra .blk{margin-bottom:12px}
  #sutra .blk.ttl{text-align:center;font-size:calc(26px * var(--fs));font-weight:900}
  #sutra h6{font-size:calc(13px * var(--fs));color:#a8874a;letter-spacing:.4em;margin-bottom:2px;font-weight:700}
  #sutra .txt span{transition:color .2s,text-shadow .2s}
  #sutra .txt span.done{color:#e8c66a}
  #sutra .txt span.now{color:#fff3c8;text-shadow:0 0 10px #ffb84a,0 0 22px #ff9a2a;font-weight:900}
  #sutra .txt span.p{color:#5a4a32}
  #sutra .foot{display:flex;align-items:center;gap:10px;padding-top:8px;border-top:1px solid #3d2b14}
  #sutra .rnd{font-size:calc(13px * var(--fs));color:#c9a045;white-space:nowrap}
  #sutra .done-msg{flex:1;font-size:calc(13px * var(--fs));color:#f6d98a}
  #sutra .go{font-family:var(--font);font-size:calc(16px * var(--fs));font-weight:900;letter-spacing:.15em;min-height:calc(42px * var(--fs));padding:0 22px;border:1px solid var(--gold);border-radius:3px;background:#8b1a1a;color:#f6d98a}
  #sutra[data-st="run"] .go{background:#3d2006}

  /* 掃墓路線 */
  body.route #title,body.route #genTag,body.route #seal,body.route #riteBanner,body.route #card{display:none!important}
  #routeBox{position:fixed;left:0;right:0;bottom:0;z-index:12;display:none;padding:0 8px}
  #routeBox.on{display:block;animation:fadeIn .35s}
  #routeBox .sheet{position:relative;max-height:48vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:linear-gradient(170deg,#faf3e0,#ede0b8);border:2px solid var(--gold);border-bottom:0;border-radius:6px 6px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.35);padding:12px 14px calc(var(--sb) + 12px)}
  #routeBox h3{color:var(--red);font-size:calc(19px * var(--fs));font-weight:900;letter-spacing:.3em;text-align:center}
  #routeBox .sub{text-align:center;color:#7a5a2a;font-size:calc(12px * var(--fs));margin:2px 0 8px}
  #routeBox .x{position:absolute;top:4px;right:8px;border:0;background:none;color:#7a5a2a;font-size:26px;padding:4px 8px}
  #routeBox .steps{list-style:none;margin:0 0 10px;padding:0}
  #routeBox .steps li{display:flex;gap:10px;padding:8px 4px;border-bottom:1px dashed #c9a045;cursor:pointer}
  #routeBox .steps li>b{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:#8b1a1a;color:#f6d98a;display:flex;align-items:center;justify-content:center;font-size:calc(14px * var(--fs))}
  #routeBox .steps li:nth-child(2)>b{background:#3a6cff;color:#fff}
  #routeBox h4{font-size:calc(16px * var(--fs));color:#2a1a08;font-weight:900}
  #routeBox .steps p{font-size:calc(12px * var(--fs));color:#7a5a2a}
  #routeBox .ppl{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ================= 族譜資料 =================
   內建資料（與紀念堂預設一致）；紀念堂「祖先名冊」填寫的內容會自動覆蓋/補上。
   主脈：{id, name, gen, parent, tag?, tablet?, birth?, death?, bio?, avatar?, alias?, alive?}
   配偶：{id, name, spouseOf, birth?, death?, datesText?, tablet?, empty?}
*/
const PEOPLE = [
  { id:'p1',  name:'曾虎',     gen:1, tag:'來台祖', tablet:'顯一世祖考曾公諱虎之神位' },
  { id:'p2',  name:'曾奎德',   gen:2, parent:'p1', tablet:'顯二世祖考諱奎德之神位' },
  { id:'p3',  name:'曾武六',   gen:3, parent:'p2', tablet:'顯三世祖考諱武六之神位' },
  { id:'p4',  name:'曾呈獅',   gen:4, parent:'p3', tablet:'顯四世祖考曾公諱呈獅之神位' },
  { id:'s4',  name:'吳香',     spouseOf:'p4' },
  { id:'p5',  name:'曾水陀',   gen:5, parent:'p4', birth:'1874', tablet:'顯五世祖考曾公諱水陀之神位' },
  { id:'s5',  name:'許羿（藝）', spouseOf:'p5', birth:'1878.08.03', death:'1916.05.26' },
  { id:'p6a', name:'曾瑞麟',   gen:6, parent:'p5', birth:'1900', tablet:'顯六世祖考曾公諱瑞麟之神位' },
  { id:'s6a', name:'曾楊玉枝', spouseOf:'p6a', birth:'1904.08.11', death:'1983.04.08' },
  { id:'p6b', name:'曾實',     gen:6, parent:'p5', tablet:'顯六世祖考曾公諱實之神位' },
  { id:'s6b', name:'無配偶',   spouseOf:'p6b', empty:true },
  { id:'p7',  name:'曾人定',   gen:7, parent:'p6a', birth:'1934', tablet:'顯七世祖考曾公諱人定之神位' },
  { id:'s7',  name:'曾張月嬌', spouseOf:'p7', birth:'1934.01.10', death:'2021.11.18' },
];

const CN = ['','一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五'];
const FONT = '"Noto Serif TC","Songti TC","PMingLiU",serif';
const sleep = ms => new Promise(r => setTimeout(r, ms));
const norm = s => (s || '').replace(/^曾/, '').trim();
const fmtDate = d => (d || '').trim().replace(/-/g, '.');

/* ---------- 同步紀念堂（index.html）的祖先名冊 ----------
   同網域讀取 localStorage 'ancestorApp_v28'：
   已有的人 → 補上神位文字、生卒忌日、生平、照片、字號、配偶
   新增的人 → 依「上一代」接到世系；在世者做成家族樹卡片（不立牌位） */
let MEM = null;
(function mergeFromMemorial() {
  let data;
  try { data = JSON.parse(localStorage.getItem('ancestorApp_v28') || 'null'); } catch (e) { return; }
  if (!data || !Array.isArray(data.ancestors)) return;
  MEM = data;
  const find = n => n && PEOPLE.find(p => !p.spouseOf && norm(p.name) === norm(n));
  const apply = (p, a) => {
    p.mid = a.id;
    ['alias', 'bio', 'avatar'].forEach(k => { if (a[k]) p[k] = a[k]; });
    if (a.tablet && !a.isAlive) p.tablet = a.tablet;
    if (a.birth) p.birth = fmtDate(a.birth);
    if (a.death) { p.death = fmtDate(a.death); p.deathLunar = a.deathCalendar === 'lunar'; }
    p.alive = !!a.isAlive;
    if (a.spouse) {
      const sp = PEOPLE.find(s => s.spouseOf === p.id);
      if (!sp) PEOPLE.push({ id: 'ms_' + p.id, name: a.spouse, spouseOf: p.id, datesText: a.spouseDates || '' });
      else if (sp.empty) Object.assign(sp, { name: a.spouse, empty: false, datesText: a.spouseDates || '' });
      else if (a.spouseDates && !sp.birth && !sp.death) sp.datesText = a.spouseDates;
    }
  };
  data.ancestors.filter(a => a && a.name && a.gen).sort((a, b) => a.gen - b.gen).forEach(a => {
    const hit = find(a.name) || find(a.alias);
    if (hit) { apply(hit, a); return; }
    const parent = find(a.parent);
    if (!parent || +parent.gen !== +a.gen - 1) return;
    const p = { id: 'm_' + a.id, name: a.name.startsWith('曾') ? a.name : '曾' + a.name, gen: +a.gen, parent: parent.id };
    PEOPLE.push(p); apply(p, a);
  });
})();

/* ---------- 神位文字（未填則依慣例產生） ---------- */
function tabletText(p) {
  if (p.empty) return '無配偶';
  if (p.tablet) return p.tablet;
  if (p.role === 'main') return `顯${CN[p.gen]}世祖考曾公諱${norm(p.name)}之神位`;
  // 配偶：冠夫姓者去掉「曾」，第一字為本姓，其餘為名，寫成「曾門X氏○○」
  const n = (p.name.length >= 3 && p.name.startsWith('曾')) ? p.name.slice(1) : p.name;
  const sur = n[0], given = n.slice(1);
  return `顯${CN[p.gen]}世祖妣曾門${sur}氏${given || '孺人'}之神位`;
}
/* 生卒顯示 */
function lifeLines(p) {
  if (p.alive) return [p.birth ? p.birth + (p.birth.length === 4 ? ' 年生' : ' 生') : '', '在世'].filter(Boolean);
  if (p.datesText) return [p.datesText];
  const b = p.birth ? (p.birth.length === 4 ? p.birth + ' 年生' : p.birth) : '';
  const d = p.death ? (p.deathLunar ? '農曆 ' : '') + p.death : '';
  if (b && d) return [b, '— ' + d];
  if (b) return [b, '仙逝'];
  if (d) return ['卒 ' + d];
  return null;
}

/* ---------- 關係整理 ---------- */
const byId = Object.fromEntries(PEOPLE.map(p => [p.id, p]));
PEOPLE.forEach(p => {
  if (p.spouseOf) { const m = byId[p.spouseOf]; p.gen = m.gen; p.role = 'spouse'; m.spouse = p; }
  else p.role = 'main';
});
PEOPLE.forEach(p => { if (p.spouseOf && byId[p.spouseOf].alive) p.alive = true; });
PEOPLE.forEach(p => { p.lines = lifeLines(p); p.tabletText = tabletText(p); });
const mains = PEOPLE.filter(p => p.role === 'main');
mains.forEach(p => p.children = mains.filter(c => c.parent === p.id));
const root = mains.find(p => !p.parent);
const MAX_GEN = Math.max(...PEOPLE.map(p => p.gen));

/* ---------- 自動佈局 ---------- */
const TW = 1.1, CG = 0.45, SIB = 1.3, GEN_H = 4.4;
const unitW = p => p.spouse ? TW * 2 + CG : TW;
function measure(p) {
  const cw = p.children.reduce((s, c) => s + measure(c), 0) + Math.max(0, p.children.length - 1) * SIB;
  p.cw = cw; p.w = Math.max(unitW(p), cw); return p.w;
}
function place(p, left) {
  p.cx = left + p.w / 2;
  let x = p.cx - p.cw / 2;
  p.children.forEach(c => { place(c, x); x += c.w + SIB; });
  const off = p.spouse ? (TW + CG) / 2 : 0;
  p.x = p.cx - off; p.y = -(p.gen - 1) * GEN_H;
  if (p.spouse) { p.spouse.x = p.cx + off; p.spouse.y = p.y; }
}
measure(root); place(root, -root.w / 2);

/* ---------- 字型就緒後才畫牌位文字（iOS 必要） ---------- */

function eraOf(y) {   // 台灣紀年：清（道光、咸豐、同治、光緒）→ 日治（明治、大正、昭和）→ 民國
  const n = k => k === 1 ? '元' : cnNum(k);
  if (y < 1821) return '';
  if (y <= 1850) return `清道光${n(y - 1820)}年`;
  if (y <= 1861) return `清咸豐${n(y - 1850)}年`;
  if (y <= 1874) return `清同治${n(y - 1861)}年`;
  if (y <= 1895) return `清光緒${n(y - 1874)}年`;
  if (y <= 1911) return `日治明治${n(y - 1867)}年`;
  if (y <= 1925) return `日治大正${n(y - 1911)}年`;
  if (y <= 1944) return `日治昭和${n(y - 1925)}年`;
  return `民國${n(y - 1911)}年`;
}
function fmtLifeDate(s, lunar) {
  const m = /(\d{4})(?:\D(\d{1,2})\D(\d{1,2}))?/.exec(s || ''); if (!m) return '';

  const md = m[2] ? (lunar ? `農曆${CN_MON[+m[2]]}月${cnDay(+m[3])}` : `${+m[2]}月${+m[3]}日`) : '';
  return `${y}年${md}${era ? `（${era}）` : ''}`;
}
function ageAt(b, d) {   // 虛歲：卒年－生年＋1（台灣訃聞、牌位慣用）
  const yb = /(\d{4})/.exec(b || ''), yd = /(\d{4})/.exec(d || '');
  if (!yb || !yd) return null;
  const a = yd[1] - yb[1] + 1;
  return a > 0 && a < 130 ? a : null;
}

  if (p.role === 'main') {
    out.push(`${p.name}，龍山派曾氏第${CN[p.gen]}世${p.tag ? `，${p.tag}` : ''}${z.ch ? `，「${z.ch}」字輩（大宗第${cnNum(z.world)}世）` : ''}。`);

  if (b) out.push(`生於${b}${d ? `，卒於${d}${age !== null ? `，享年${age}歲` : ''}` : (p.alive ? '' : '，已仙逝')}。`);

function drawVerticalText(g, text, x0, x1, top, bottom, color, maxFs = 28, minFs = 17) {

    const per = Math.floor((bottom - top) / (f * 1.1)), out = [];
    paras.forEach(chs => { for (let i = 0; i < chs.length; i += per) out.push(chs.slice(i, i + per)); });
    return out;
  };
  while (true) {
    cols = layout(fs);
    if (cols.length <= Math.floor((x1 - x0) / (fs * 1.38)) + 1 || fs <= minFs) break;
    fs -= 1;
  }
  const maxCols = Math.floor((x1 - x0) / (fs * 1.38)) + 1;
  if (cols.length > maxCols) { cols = cols.slice(0, maxCols); const l = cols[maxCols - 1]; l[l.length - 1] = '…'; }
  g.fillStyle = color; g.font = `700 ${fs}px ${FONT}`;
  cols.forEach((col, ci) => col.forEach((ch, i) => g.fillText(ch, x1 - ci * fs * 1.38, top + fs * .55 + i * fs * 1.1)));
}

/* ---------- 金色世系連線 ---------- */
const rodGeo = new THREE.CylinderGeometry(1, 1, 1, 10);
const knotGeo = new THREE.OctahedronGeometry(.11);
function rod(a, b, r = .035) {
  const d = new THREE.Vector3().subVectors(b, a), len = d.length();
  const m = new THREE.Mesh(rodGeo, M.gold);
  m.scale.set(r, len, r);
  m.position.copy(a).addScaledVector(d, .5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  scene.add(m);
}
function knot(v, s = 1) { const k = new THREE.Mesh(knotGeo, M.gold); k.position.copy(v); k.scale.setScalar(s); scene.add(k); }
const V = (x, y, z = 0) => new THREE.Vector3(x, y, z);
const TOP_OFF = BODY_H / 2 + .62 * .6 + .14, BOT_OFF = BODY_H / 2 + .3;
function buildLines() {
  mains.forEach(p => {
    const coupleY = p.alive ? p.y + .5 : p.y - .55;
    if (p.spouse) {   // 夫妻連結
      const y = coupleY;
      rod(V(p.x + TW / 2, y, -.02), V(p.spouse.x - TW / 2, y, -.02), .028);
      knot(V(p.cx, y, -.02), .9);
    }
    if (!p.children.length) return;
    const sy = p.alive ? p.y + TOP_OFF - .45 - LIVE_H : p.y - BOT_OFF, ty = p.y - GEN_H + TOP_OFF, my = (p.y - BOT_OFF + ty) / 2;
    rod(V(p.cx, p.spouse ? coupleY : sy), V(p.cx, my));
    const xs = p.children.map(c => c.x);
    const minX = Math.min(p.cx, ...xs), maxX = Math.max(p.cx, ...xs);
    if (maxX - minX > .01) rod(V(minX, my), V(maxX, my));
    knot(V(p.cx, my), 1.1);
    p.children.forEach(c => { rod(V(c.x, my), V(c.x, ty)); if (Math.abs(c.x - p.cx) > .01) knot(V(c.x, my)); });
  });
}

const HISTORY_DEFAULT = `曾氏家族沿革

一、姓氏由來與上古淵源

禹的第五世孫少康中興夏朝後，將最小的兒子曲烈封於「鄫」地（今山東省嶧縣），建立鄫國。春秋時代，鄫國被莒國所併，鄫國太子巫懷著亡國之痛奔往魯國，為紀念故國，決定去「邑」旁為「曾」，以「曾」為姓，此即曾姓之始。

二、血脈淵源與宗聖精神

三、渡台開墾史（新港開基支脈）

明崇禎十五年（1642年），原籍福建省澄邑的曾振賜公渡海來台，開基於台南，為曾氏入台之始。

康熙末年（約1720年），始祖兄弟五人——連公、旺公、龍公、虎公、耄公，原籍福建泉州府同安縣，由連公率領航海東渡來台，落腳雲林口湖一帶，勤耕務農，篳路藍縷，開創基業。

奎壁呈雲瑞，人文煥國華，台衡思繼武，鼎甲勵承家，

function computeBounds() {
  const xs = PEOPLE.map(p => p.x), ys = PEOPLE.map(p => p.y);
  bounds = { minX: Math.min(...xs) - TW, maxX: Math.max(...xs) + TW, minY: Math.min(...ys) - BOT_OFF - .4, maxY: Math.max(...ys) + TOP_OFF + .2 };
  if (plaquePos) { bounds.minX = Math.min(bounds.minX, hallExt.minX); bounds.maxX = Math.max(bounds.maxX, hallExt.maxX); bounds.maxY = Math.max(bounds.maxY, plaquePos.y + .8); }
}
function fitDist(w, h) {

  return Math.max(h / 2 / t, w / 2 / (t * camera.aspect));
}
function overviewView() {
  const cx = (bounds.minX + bounds.maxX) / 2, cy = (bounds.minY + bounds.maxY) / 2;
  const d = fitDist((bounds.maxX - bounds.minX) * 1.15, (bounds.maxY - bounds.minY) * 1.12);
  return [V(cx + d * .22, cy + d * .06, d), V(cx, cy, 0)];
}

  if (g === 1 && plaquePos) {   // 第一世連同匾額、對聯一起入鏡

  const d = Math.max(5.5, fitDist(Math.max(...xs) - Math.min(...xs) + TW + 1.4, GEN_H * .95));
  return [V(cx + d * .14, y + .5, d), V(cx, y + .1, 0)];
}

  el.querySelector('.prev').onclick = () => { photoStopScan(); photoGo(PHOTO.i - 1, 1.2); };
  el.querySelector('.next').onclick = () => { photoStopScan(); photoGo(PHOTO.i + 1, 1.2); };
  el.querySelector('.shoot').onclick = capturePhoto;
  el.querySelector('.scan').onclick = () => PHOTO.scan ? photoStopScan() : photoScan();
  el.querySelector('.out').onclick = exitPhoto;
})();

/* ================= 文字縮放：兩指在面板、選單、經文上縮放字體（3D 畫面仍是縮放鏡頭） ================= */
(() => {
  const root = document.documentElement, KEY = 'zupu_fs';
  let fs = 1; try { fs = Math.min(2, Math.max(.8, parseFloat(localStorage.getItem(KEY)) || 1)); } catch (e) {}
  const apply = (v, show) => {
    fs = Math.min(2, Math.max(.8, v)); root.style.setProperty('--fs', fs.toFixed(3));
    if (show) toast(`文字大小 ${Math.round(fs * 100)}%`);
  };
  const save = () => { try { localStorage.setItem(KEY, fs.toFixed(3)); } catch (e) {} };
  apply(fs);
  const onUI = t => t && t !== canvas && !(t.closest && t.closest('canvas'));
  let start = null, base = 1, lastToast = 0;
  const dist = ts => Math.hypot(ts[0].clientX - ts[1].clientX, ts[0].clientY - ts[1].clientY);
  document.addEventListener('touchstart', e => {
    if (e.touches.length === 2 && onUI(e.target)) { start = dist(e.touches); base = fs; }
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (start && e.touches.length === 2) {
      e.preventDefault();
      const now = performance.now(), show = now - lastToast > 250; if (show) lastToast = now;
      apply(base * dist(e.touches) / start, show);
    }
  }, { passive: false });
  document.addEventListener('touchend', e => { if (start && e.touches.length < 2) { start = null; save(); } });
  // iOS Safari：擋掉整頁縮放，改由上面的文字縮放處理
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => { if (onUI(e.target)) e.preventDefault(); }, { passive: false }));
  // 電腦：Ctrl＋滾輪（觸控板捏合）在面板上縮放文字
  document.addEventListener('wheel', e => {
    if (e.ctrlKey && onUI(e.target)) { e.preventDefault(); apply(fs * Math.exp(-e.deltaY * .01), true); save(); }
  }, { passive: false });
})();

/* ---------- 尺寸 ---------- */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
if (window.visualViewport) visualViewport.addEventListener('resize', resize);

/* ================= 動畫迴圈 ================= */
const clock = new THREE.Clock();
const tMin = new THREE.Vector3(), tMax = new THREE.Vector3();
function loop() {
  const dt = Math.min(clock.getDelta(), .05), now = performance.now(), T = now / 1000;

  if (flight) {
    const k = Math.min(1, (now - flight.start) / flight.dur), e = ease(k);
    camera.position.lerpVectors(flight.p0, flight.p1, e);
    controls.target.lerpVectors(flight.t0, flight.t1, e);
    camera.lookAt(controls.target);
    if (k >= 1) { const r = flight.res; flight = null; controls.update(); r(); }
  } else if (!ROUTE.anim) {   // 路線導覽時由追蹤鏡頭控制
    controls.target.clamp(tMin, tMax);
    controls.update();
  }

  if (selected) tablets[selected].front.emissiveIntensity = .18 + .14 * Math.sin(T * 3);
  for (const key in OFFER_SETS) {
    const set = OFFER_SETS[key];
    if (!set.R.visible) continue;
    const cg = set.types.candle.group;
    if (cg.visible) {
      let sum = 0;
      set.flames.forEach(f => {   // 燭火閃動：亮度、高度隨機跳動，火舌左右擺
        if (Math.random() < .18) f.tv = .62 + Math.random() * .58;
        if (Math.random() < .08) f.ts = (Math.random() - .5) * .028;
        f.v += (f.tv - f.v) * Math.min(1, dt * 22); f.sway += (f.ts - f.sway) * Math.min(1, dt * 9);
        const h = .17 * (.75 + f.v * .4), w = .09 * (1.08 - f.v * .12);
        f.fl.scale.set(w, h, 1); f.fl.position.set(f.x + f.sway, f.y + (h - .17) / 2, 0); f.fl.material.opacity = .7 + f.v * .3;
        f.core.scale.set(.035, .08 * (.8 + f.v * .3), 1); f.core.position.x = f.x + f.sway * .5;
        f.glow.material.opacity = .18 + f.v * .22; f.glow.scale.setScalar(.26 + f.v * .1);
        sum += f.v;
      });
      set.light.intensity = 1.6 * set.s * (sum / set.flames.length);
    }
    for (const k in set.types) { const g = set.types[k].group; if (g.visible && g.scale.x < .999) g.scale.setScalar(Math.min(1, g.scale.x + dt * 2.2)); else if (!g.visible) g.scale.setScalar(.01); }
  }
  chantAudioTick();
  tickRoute(now, dt);
  tickEmbers(T, dt);
  if (steleFront) { steleFront.emissiveIntensity = .05 + .04 * Math.sin(T * 1.3); steleHalo.material.opacity = .42 + .12 * Math.sin(T * 1.3); }
  for (const id in tablets) {
    const t = tablets[id], goal = t.flip * Math.PI;
    if (id !== selected) {
      let e = 0;
      if (t.memorial) e = .22 + .16 * Math.sin(T * 2);
      if (t.chanting) e = Math.max(e, .3 + .18 * Math.sin(T * 1.6));
      if (t.offerGlow) { const k = (now - t.offerGlow) / 3000; if (k < 1) e = Math.max(e, .5 * (1 - k)); else t.offerGlow = 0; }
      t.front.emissiveIntensity = e;
    }
    if (t.aura) t.aura.material.opacity = .45 + .2 * Math.sin(T * 2);
    if (Math.abs(t.grp.rotation.y - goal) > .001) t.grp.rotation.y += (goal - t.grp.rotation.y) * Math.min(1, dt * 5);
    if (t.sway !== undefined) t.grp.rotation.z = Math.sin(T * .9 + t.sway) * .025;
  }

  if (dust) {
    const a = dust.geometry.attributes.position, { sp, b } = dust.userData;
    for (let i = 0; i < sp.length; i++) {
      let y = a.getY(i) + sp[i] * dt;
      if (y > b.maxY + 4) y = b.minY - 4;
      a.setY(i, y); a.setX(i, a.getX(i) + Math.sin(T * .6 + i) * .002);
    }
    a.needsUpdate = true;
  }
  for (let k = emitters.length - 1; k >= 0; k--) {
    const e = emitters[k];
    if (e.until && now > e.until) {
      e.sprites.forEach(sp => { scene.remove(sp); sp.material.dispose(); });
      if (e.group) scene.remove(e.group);
      emitters.splice(k, 1); continue;
    }
    const fadeIn = Math.min(1, (now - e.born) / 1500), fadeOut = e.until ? Math.min(1, (e.until - now) / 4000) : 1;
    e.sprites.forEach(sp => {
      const t = (sp.userData.t + T * .12) % 1;
      sp.position.set(e.pos.x + Math.sin(t * 9 + sp.userData.t * 20) * .15 * t * e.sz, e.pos.y + t * e.h, e.pos.z - t * .3 * e.sz);
      sp.scale.setScalar((.15 + t * .9) * e.sz);
      sp.material.opacity = Math.sin(t * Math.PI) * e.op * fadeIn * fadeOut;
    });
  }

  renderer.render(scene, camera);
}

/* ================= 啟動 ================= */
async function start() {
  const introT0 = performance.now();
  const riteP = loadRite();
  PEOPLE.forEach(autoBio);   // 先整理生平，字型才會一併載入
  await waitFonts();
  PEOPLE.forEach(buildTablet);
  buildLines();
  buildAltar();
  buildHall();
  computeBounds();
  buildBackdrop((bounds.minY + bounds.maxY) / 2);
  buildDust(bounds);
  buildBar();
  computeAnniv();
  tMin.set(bounds.minX - 4, bounds.minY - 4, -3); tMax.set(bounds.maxX + 4, bounds.maxY + 4, 3);
  if (towerHall) { tMax.x = towerHall.x + 4; tMin.y = Math.min(tMin.y, towerHall.bottom - 2); }

  const [p0, t0] = genView(1);
  camera.position.copy(p0).add(V(0, 4, 6)); controls.target.copy(t0); camera.lookAt(t0);
  renderer.setAnimationLoop(loop);
  window.__zupuReady = true;

  const intro = document.getElementById('intro');
  let skipped = false;
  const todayAnniv = ANNIV.find(a => a.days === 0);
  riteP.then(() => { refreshOfferings(); showRiteBanner(); if (selected) openCard(byId[selected]); });
  intro.addEventListener('pointerdown', () => {
    if (skipped) return; skipped = true; intro.classList.add('hide');
    stopTour();
    if (todayAnniv) selectPerson(todayAnniv.p.id); else flyTo(overviewView(), 1.2);
  });
  await sleep(Math.max(0, 2600 - (performance.now() - introT0)));
  if (skipped) return;
  intro.classList.add('hide'); skipped = true;
  if (todayAnniv) { await flyTo(genView(1), 1.4); selectPerson(todayAnniv.p.id); }   // 忌日當天：直接帶到該位祖先
  else tour();
}
start();
