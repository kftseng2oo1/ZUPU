<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2a1a08">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>龍山派 曾氏族譜 · 立體世系祠堂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a0f00; --gold:#b8860b; --gold-l:#e2bd62; --red:#8b1a1a; --paper:#ece0c4;
    --font:'Noto Serif TC','Songti TC','PMingLiU',serif;
    --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--paper);font-family:var(--font);color:var(--ink);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  /* 標題 */
  #title{position:fixed;top:calc(var(--st) + 14px);left:16px;pointer-events:none;z-index:5}
  #title h1{font-size:20px;font-weight:900;color:var(--red);letter-spacing:.25em}
  #title p{font-size:11px;color:#7a5a2a;letter-spacing:.3em;margin-top:2px}
  #genTag{position:fixed;top:calc(var(--st) + 14px);right:16px;z-index:5;pointer-events:none;
    writing-mode:vertical-rl;font-weight:900;font-size:18px;letter-spacing:.3em;color:var(--gold);
    background:rgba(42,26,8,.82);padding:10px 6px;border:1px solid var(--gold);border-radius:3px;opacity:0;transition:opacity .4s}
  #genTag.on{opacity:1}

  /* 印章 */
  #seal{position:fixed;right:14px;bottom:calc(var(--sb) + 76px);z-index:5;pointer-events:none;
    width:58px;height:58px;border:3px solid #a82020;border-radius:4px;color:#a82020;
    display:flex;align-items:center;justify-content:center;transform:rotate(-6deg);
    font-weight:900;font-size:13px;line-height:1.15;text-align:center;background:rgba(236,224,196,.55)}

  /* 底部工具列 */
  #bar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 10px calc(var(--sb) + 10px);
    background:linear-gradient(to top,rgba(42,26,8,.92),rgba(42,26,8,.75));border-top:1px solid var(--gold);
    display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  #bar::-webkit-scrollbar{display:none}
  #bar button{flex:0 0 auto;min-width:38px;height:40px;padding:0 10px;border:1px solid #8b6020;border-radius:3px;
    background:#3d2006;color:var(--gold-l);font-family:var(--font);font-size:15px;font-weight:700;cursor:pointer}
  #bar button.on{background:var(--gold);color:#2a1505;border-color:var(--gold-l)}
  #bar .sep{flex:0 0 1px;background:#8b6020;margin:4px 2px}

  /* 資料卡 */
  #card{position:fixed;left:50%;bottom:calc(var(--sb) + 74px);z-index:7;width:min(92vw,360px);
    transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:all .35s ease;
    background:linear-gradient(170deg,#faf3e0,#ede0b8);border:2px solid var(--gold);border-radius:4px;
    box-shadow:0 0 0 4px rgba(61,32,6,.85),0 10px 30px rgba(0,0,0,.45);padding:16px 18px 14px}
  #card.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  #card .hd{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid #c9a045;padding-bottom:8px;margin-bottom:8px}
  #card .nm{font-size:26px;font-weight:900;color:var(--red);letter-spacing:.12em}
  #card .gn{font-size:13px;color:#7a5a2a;letter-spacing:.2em}
  #card .tg{font-size:12px;color:#faf3e0;background:var(--red);padding:2px 8px;border-radius:2px;margin-left:auto}
  #card dl{display:grid;grid-template-columns:4.2em 1fr;row-gap:6px;font-size:15px}
  #card dt{color:#7a5a2a}
  #card dd{color:var(--ink);font-weight:700}
  #card{max-height:62vh;overflow-y:auto}
  #card .av{width:44px;height:54px;object-fit:cover;border:2px solid var(--gold);border-radius:2px;align-self:center}
  #card .bio{margin-top:10px;padding-top:8px;border-top:1px dashed #c9a045;font-size:14px;line-height:1.75;color:#3d2b1a;white-space:pre-wrap}
  #card .btns{display:flex;gap:8px;margin-top:12px}
  #card .tw{flex:1;height:38px;border:1px solid var(--gold);border-radius:3px;background:#f3e3b8;color:#5a0d0d;font-family:var(--font);font-size:15px;font-weight:700;letter-spacing:.15em;cursor:pointer}
  #card .flip{flex:2;height:38px;border:1px solid var(--gold);border-radius:3px;background:#3d2006;color:var(--gold-l);font-family:var(--font);font-size:15px;font-weight:700;letter-spacing:.2em;cursor:pointer}
  #card dd{word-break:break-all}
  #card.mini dl,#card.mini .bio{display:none}
  #card.mini .hd{border-bottom:0;margin-bottom:0}
  #card .x{position:absolute;top:6px;right:8px;border:0;background:none;font-size:22px;color:#7a5a2a;cursor:pointer;padding:4px}

  /* 開場卷軸 */
  #intro{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at center,#3d2006,#1a0d03);
    display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .9s}
  #intro.hide{opacity:0;pointer-events:none}
  .scroll{display:flex;flex-direction:column;align-items:center}
  .rod{width:min(62vw,250px);height:16px;border-radius:8px;
    background:linear-gradient(to bottom,#7a4a1a,#c99a3a 40%,#5a3010);box-shadow:0 3px 8px rgba(0,0,0,.6);position:relative}
  .rod::before,.rod::after{content:'';position:absolute;top:-3px;width:14px;height:22px;border-radius:4px;background:#d4a843}
  .rod::before{left:-10px}.rod::after{right:-10px}
  .paper{width:min(56vw,224px);height:0;overflow:hidden;animation:unroll 1.8s .3s cubic-bezier(.6,.05,.3,1) forwards;
    background:linear-gradient(170deg,#faf3e0,#ede0b8);border-left:2px solid var(--gold);border-right:2px solid var(--gold);
    display:flex;align-items:center;justify-content:center;position:relative}
  @keyframes unroll{to{height:min(60vh,440px)}}
  .paper .ttl{writing-mode:vertical-rl;font-size:clamp(28px,8vw,40px);font-weight:900;color:var(--red);letter-spacing:.35em;line-height:1.6}
  .paper .sub{position:absolute;bottom:18px;left:18px;writing-mode:vertical-rl;font-size:12px;color:#7a5a2a;letter-spacing:.3em}
  .paper .stamp{position:absolute;bottom:20px;right:16px;width:40px;height:40px;border:2px solid #a82020;color:#a82020;
    font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1}
  #intro .hint{margin-top:22px;color:#c9a045;font-size:13px;letter-spacing:.4em;opacity:.8}
  #intro .err{margin-top:14px;color:#ffb0a0;font-size:13px;max-width:80vw;text-align:center;display:none}

  /* 祭祀 */
  #riteBanner{position:fixed;left:50%;top:calc(var(--st) + 64px);transform:translateX(-50%);z-index:6;display:none;cursor:pointer;
    background:linear-gradient(90deg,#5a0d0d,#8b1a1a,#5a0d0d);border:1px solid var(--gold-l);border-radius:3px;padding:7px 16px;text-align:center;
    box-shadow:0 0 18px rgba(255,190,80,.55);max-width:86vw}
  #riteBanner.on{display:block;animation:glow 2.4s ease-in-out infinite}
  @keyframes glow{50%{box-shadow:0 0 30px rgba(255,200,90,.9)}}
  #riteBanner b{display:block;color:#f6d98a;font-size:15px;letter-spacing:.12em}
  #riteBanner span{display:block;color:#f3e3b8;font-size:12px;margin-top:2px}
  #toast{position:fixed;left:50%;top:calc(var(--st) + 128px);transform:translate(-50%,-10px);z-index:40;opacity:0;pointer-events:none;transition:all .3s;
    background:rgba(42,26,8,.92);color:var(--gold-l);border:1px solid var(--gold);padding:9px 16px;border-radius:3px;font-size:14px;max-width:88vw;text-align:center}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  .dlg{position:fixed;inset:0;z-index:35;background:rgba(20,10,2,.7);display:none;align-items:center;justify-content:center;padding:20px}
  .dlg.on{display:flex}
  .dlg .in{width:min(90vw,360px);background:linear-gradient(170deg,#faf3e0,#ede0b8);border:2px solid var(--gold);border-radius:4px;padding:18px;box-shadow:0 0 0 4px rgba(61,32,6,.85)}
  .dlg h4{color:var(--red);font-size:17px;font-weight:900;margin-bottom:12px;letter-spacing:.08em}
  .dlg input{width:100%;font-family:var(--font);font-size:16px;padding:9px 10px;border:1px solid #c9a045;border-radius:3px;background:#fffaf0;margin-bottom:10px;-webkit-user-select:text;user-select:text}
  .dlg .row{display:flex;gap:8px;flex-wrap:wrap}
  .dlg button{flex:1;min-width:80px;height:40px;font-family:var(--font);font-size:15px;font-weight:700;border-radius:3px;border:1px solid var(--gold);background:#3d2006;color:var(--gold-l)}
  .dlg button.no{background:#f3e3b8;color:#5a0d0d}
  #offerBox .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  #offerBox .grid button{height:auto;min-height:74px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:#fbf4e2;color:#5a0d0d;border:1px solid #c9a045}
  #offerBox .grid button b{font-size:19px;letter-spacing:.3em;color:#8b1a1a}
  #offerBox .grid button small{font-size:11px;font-weight:400;color:#7a5a2a}
  #offerBox .grid button em{font-style:normal;font-size:11px;color:#fff;background:#8b1a1a;border-radius:2px;padding:0 6px}
  #offerBox .grid .of-incense{grid-column:1 / -1;background:#8b1a1a;border-color:#8b1a1a}
  #offerBox .grid .of-incense b,#offerBox .grid .of-incense small{color:#f6d98a}
  #recBox .tm{text-align:center;font-size:20px;font-weight:900;color:#5a0d0d;margin:6px 0 10px;letter-spacing:.1em}
  #recBox audio{width:100%;margin-bottom:10px;display:none}
  #recBox .stop,#recBox .redo,#recBox .ok{display:none}
  #recBox[data-st="rec"] .go,#recBox[data-st="done"] .go,#recBox[data-st="up"] .go{display:none}
  #recBox[data-st="rec"] .stop{display:block;background:#8b1a1a}
  #recBox[data-st="rec"] .tm{color:#c0392b}
  #recBox[data-st="done"] .redo,#recBox[data-st="done"] .ok{display:block}
  #recBox[data-st="done"] audio{display:block}
  #card .voices h5{font-size:13px;color:#7a5a2a;margin:10px 0 4px;letter-spacing:.2em}
  #card .vrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed #d9c48a}
  #card .vrow span{flex:1;display:flex;flex-direction:column}
  #card .vrow b{font-size:14px;color:#2a1a08}
  #card .vrow small{font-size:12px;color:#7a5a2a}
  #card .vplay{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);background:#3d2006;color:var(--gold-l);font-size:13px}
  #card .vplay.on{background:var(--gold);color:#3d2006}
  #card .vdel{font-family:var(--font);font-size:12px;border:0;background:none;color:#8b1a1a;text-decoration:underline}
  #card .inc{flex:1;height:38px;border:1px solid #8b1a1a;border-radius:3px;background:#8b1a1a;color:#f6d98a;font-family:var(--font);font-size:15px;font-weight:900;letter-spacing:.2em}
  #card .ofr{flex:1;height:38px;border:1px solid #8b1a1a;border-radius:3px;background:#fbefd8;color:#8b1a1a;font-family:var(--font);font-size:15px;font-weight:900;letter-spacing:.2em}
  #card .rec{flex:1;height:38px;border:1px solid var(--gold);border-radius:3px;background:#f3e3b8;color:#5a0d0d;font-family:var(--font);font-size:15px;font-weight:700;letter-spacing:.1em}
  .rstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 12px}
  .rstat div{background:#fbf4e2;border:1px solid #c9a045;border-radius:3px;text-align:center;padding:8px 0}
  .rstat b{display:block;font-size:24px;color:#8b1a1a}.rstat small{font-size:12px;color:#7a5a2a}
  .rbtn{width:100%;height:44px;font-family:var(--font);font-size:16px;font-weight:900;letter-spacing:.2em;border:1px solid #8b1a1a;background:#8b1a1a;color:#f6d98a;border-radius:3px}
  .rrow{display:flex;align-items:baseline;gap:8px;padding:8px 2px;border-bottom:1px dashed #d9c48a;font-size:15px;cursor:pointer}
  .rrow b{color:#2a1a08;white-space:nowrap}.rrow span{flex:1;color:#5a3a10;font-size:14px}.rrow em{font-style:normal;font-size:12px;color:#7a5a2a;white-space:nowrap}
  .rrow em.hot{color:#fff;background:#8b1a1a;padding:1px 6px;border-radius:2px}
  .rtoday{font-size:14px!important;text-align:center;color:#5a3a10!important;margin:0 0 10px!important}
  .rnote{font-size:12px!important;color:#7a5a2a!important;margin-top:12px}

  /* 卷軸展讀 */
  #scrollReader{position:fixed;inset:0;z-index:25;background:rgba(20,10,2,.88);display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--st) + 16px) 14px calc(var(--sb) + 16px)}
  #scrollReader.on{display:flex;animation:fadeIn .35s}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  #scrollReader .rodr{width:min(96vw,560px);height:16px;border-radius:8px;background:linear-gradient(to bottom,#7a4a1a,#c99a3a 40%,#5a3010);box-shadow:0 3px 8px rgba(0,0,0,.6);flex:0 0 auto}
  #scrollReader .body{width:min(90vw,520px);flex:0 1 auto;max-height:calc(100vh - 150px);overflow-y:auto;-webkit-overflow-scrolling:touch;
    background:linear-gradient(170deg,#faf3e0,#ede0b8);border-left:2px solid var(--gold);border-right:2px solid var(--gold);padding:20px 22px;user-select:text;-webkit-user-select:text}
  #scrollReader h2{color:var(--red);font-size:22px;font-weight:900;letter-spacing:.2em;text-align:center;margin-bottom:12px}
  #scrollReader h3{color:#7a1010;font-size:17px;font-weight:900;margin:18px 0 6px;border-left:4px solid var(--gold);padding-left:8px}
  #scrollReader p{font-size:16px;line-height:1.9;color:#2a1a08;margin-bottom:8px;text-align:justify}
  #scrollReader .close{margin-top:14px;font-family:var(--font);font-size:15px;padding:8px 28px;border:1px solid var(--gold);background:#3d2006;color:var(--gold-l);border-radius:3px}
  .zbgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
  .zb{border:1px solid #c9a045;background:#fbf4e2;border-radius:3px;padding:6px 2px;text-align:center}
  .zb b{display:block;font-size:26px;color:#8b1a1a;font-weight:900}
  .zb small{display:block;font-size:11px;color:#7a5a2a}
  .zb em{display:block;font-style:normal;font-size:10px;color:#3d2b1a;margin-top:2px;line-height:1.3}
  .zb.on{background:#8b1a1a;border-color:#8b1a1a}.zb.on b,.zb.on small,.zb.on em{color:#f6d98a}

  /* 海報輸出 */
  #poster{position:fixed;inset:0;z-index:30;background:rgba(20,10,2,.92);display:none;flex-direction:column;
    align-items:center;justify-content:center;padding:20px}
  #poster.on{display:flex}
  #poster img{max-width:92vw;max-height:72vh;border:2px solid var(--gold);-webkit-touch-callout:default}
  #poster p{color:var(--gold-l);margin:12px 0;font-size:14px;letter-spacing:.2em}
  #poster .btns{display:flex;gap:10px}
  #poster a,#poster button{font-family:var(--font);font-size:15px;padding:8px 18px;border:1px solid var(--gold);
    background:#3d2006;color:var(--gold-l);border-radius:3px;text-decoration:none}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="title"><h1>龍山派 曾氏族譜</h1><p>立體世系祠堂</p></div>
<div id="genTag"></div>
<div id="seal">曾氏<br>龍山<br>族譜</div>

<div id="card">
  <button class="x" aria-label="關閉">×</button>
  <div class="hd"><img class="av" alt=""><span class="nm"></span><span class="gn"></span><span class="tg"></span></div>
  <dl></dl>
  <p class="bio"></p>
  <div class="voices"></div>
  <div class="btns"><button class="inc">上 香</button><button class="ofr">供 奉</button><button class="rec">錄音口述</button></div>
  <div class="btns"><button class="flip">翻面看生平</button><button class="tw">看塔位</button></div>
</div>

<div id="bar"></div>

<div id="intro">
  <div class="scroll">
    <div class="rod"></div>
    <div class="paper">
      <div class="ttl">龍山派<br>曾氏族譜</div>
      <div class="sub">世系圖</div>
      <div class="stamp">曾氏<br>龍山</div>
    </div>
    <div class="rod"></div>
  </div>
  <div class="hint">輕觸略過</div>
  <div class="err" id="err">3D 元件載入失敗，請確認網路連線後重新整理。</div>
</div>

<div id="riteBanner"></div>
<div id="toast"></div>
<div id="askBox" class="dlg"><div class="in"><h4></h4><input maxlength="20"><div class="row"><button class="no">取消</button><button class="ok">確定</button></div></div></div>
<div id="offerBox" class="dlg"><div class="in">
  <h4></h4>
  <div class="grid"></div>
  <div class="row"><button class="no">取消</button></div>
</div></div>
<div id="recBox" class="dlg" data-st="idle"><div class="in">
  <h4></h4>
  <input class="title" maxlength="24" placeholder="標題（例：阿公講渡台的故事）">
  <div class="tm"></div>
  <audio controls playsinline></audio>
  <div class="row">
    <button class="no">關閉</button>
    <button class="go">● 開始錄音</button><button class="stop">■ 停止</button>
    <button class="redo">重錄</button><button class="ok">上傳保存</button>
  </div>
</div></div>

<div id="scrollReader">
  <div class="rodr"></div>
  <div class="body"></div>
  <div class="rodr"></div>
  <button class="close">收起</button>
</div>

<div id="poster">
  <img alt="族譜海報">
  <p>長按圖片即可儲存</p>
  <div class="btns"><a download="曾氏族譜.png">下載</a><button>關閉</button></div>
</div>

<script>
  // three.js 若因網路失敗沒有啟動，提示使用者
  setTimeout(()=>{ if(!window.__zupuReady) document.getElementById('err').style.display='block'; }, 12000);
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ================= 族譜資料 =================
   內建資料（與紀念堂預設一致）；紀念堂「祖先名冊」填寫的內容會自動覆蓋/補上。
   主脈：{id, name, gen, parent, tag?, tablet?, birth?, death?, bio?, avatar?, alias?, alive?}
   配偶：{id, name, spouseOf, birth?, death?, datesText?, tablet?, empty?}
*/
const PEOPLE = [
  { id:'p1',  name:'曾虎',     gen:1, tag:'來台祖', tablet:'顯一世祖考曾公諱虎之神位' },
  { id:'p2',  name:'曾奎德',   gen:2, parent:'p1', tablet:'顯二世祖考諱奎德之神位' },
  { id:'p3',  name:'曾武六',   gen:3, parent:'p2', tablet:'顯三世祖考諱武六之神位' },
  { id:'p4',  name:'曾呈獅',   gen:4, parent:'p3', tablet:'顯四世祖考曾公諱呈獅之神位' },
  { id:'s4',  name:'吳香',     spouseOf:'p4' },
  { id:'p5',  name:'曾水陀',   gen:5, parent:'p4', birth:'1874', tablet:'顯五世祖考曾公諱水陀之神位' },
  { id:'s5',  name:'許羿（藝）', spouseOf:'p5', birth:'1878.08.03', death:'1916.05.26' },

(function mergeFromMemorial() {
  let data;
  try { data = JSON.parse(localStorage.getItem('ancestorApp_v28') || 'null'); } catch (e) { return; }
  if (!data || !Array.isArray(data.ancestors)) return;
  MEM = data;
  const find = n => n && PEOPLE.find(p => !p.spouseOf && norm(p.name) === norm(n));
  const apply = (p, a) => {
    p.mid = a.id;
    ['alias', 'bio', 'avatar'].forEach(k => { if (a[k]) p[k] = a[k]; });
    if (a.tablet && !a.isAlive) p.tablet = a.tablet;
    if (a.birth) p.birth = fmtDate(a.birth);
    if (a.death) { p.death = fmtDate(a.death); p.deathLunar = a.deathCalendar === 'lunar'; }
    p.alive = !!a.isAlive;
    if (a.spouse) {
      const sp = PEOPLE.find(s => s.spouseOf === p.id);
      if (!sp) PEOPLE.push({ id: 'ms_' + p.id, name: a.spouse, spouseOf: p.id, datesText: a.spouseDates || '' });
      else if (sp.empty) Object.assign(sp, { name: a.spouse, empty: false, datesText: a.spouseDates || '' });

    const hit = find(a.name) || find(a.alias);
    if (hit) { apply(hit, a); return; }
    const parent = find(a.parent);
    if (!parent || +parent.gen !== +a.gen - 1) return;
    const p = { id: 'm_' + a.id, name: a.name.startsWith('曾') ? a.name : '曾' + a.name, gen: +a.gen, parent: parent.id };

const rodGeo = new THREE.CylinderGeometry(1, 1, 1, 10);
const knotGeo = new THREE.OctahedronGeometry(.11);
function rod(a, b, r = .035) {
  const d = new THREE.Vector3().subVectors(b, a), len = d.length();
  const m = new THREE.Mesh(rodGeo, M.gold);
  m.scale.set(r, len, r);
  m.position.copy(a).addScaledVector(d, .5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());

}
function knot(v, s = 1) { const k = new THREE.Mesh(knotGeo, M.gold); k.position.copy(v); k.scale.setScalar(s); scene.add(k); }
const V = (x, y, z = 0) => new THREE.Vector3(x, y, z);
const TOP_OFF = BODY_H / 2 + .62 * .6 + .14, BOT_OFF = BODY_H / 2 + .3;
function buildLines() {
  mains.forEach(p => {
    const coupleY = p.alive ? p.y + .5 : p.y - .55;
    if (p.spouse) {   // 夫妻連結
      const y = coupleY;
      rod(V(p.x + TW / 2, y, -.02), V(p.spouse.x - TW / 2, y, -.02), .028);
      knot(V(p.cx, y, -.02), .9);
    }
    if (!p.children.length) return;
    const sy = p.alive ? p.y + TOP_OFF - .45 - LIVE_H : p.y - BOT_OFF, ty = p.y - GEN_H + TOP_OFF, my = (p.y - BOT_OFF + ty) / 2;
    rod(V(p.cx, p.spouse ? coupleY : sy), V(p.cx, my));
    const xs = p.children.map(c => c.x);
    const minX = Math.min(p.cx, ...xs), maxX = Math.max(p.cx, ...xs);
    if (maxX - minX > .01) rod(V(minX, my), V(maxX, my));
    knot(V(p.cx, my), 1.1);
    p.children.forEach(c => { rod(V(c.x, my), V(c.x, ty)); if (Math.abs(c.x - p.cx) > .01) knot(V(c.x, my)); });
  });
}

const HISTORY_DEFAULT = `曾氏家族沿革

一、姓氏由來與上古淵源

曾氏家族擁有上下銜接四、五千年的悠久源流，其祖脈可追溯至遠古時代。上古祖神神農氏教民耕種、製藥醫病；黃帝（公孫名軒轅）建都有熊，為天下共主；其後仁慈智慧的堯帝、以孝聞名的舜帝，以及治水有功的禹，皆為曾氏先祖。

禹的第五世孫少康中興夏朝後，將最小的兒子曲烈封於「鄫」地（今山東省嶧縣），建立鄫國。春秋時代，鄫國被莒國所併，鄫國太子巫懷著亡國之痛奔往魯國，為紀念故國，決定去「邑」旁為「曾」，以「曾」為姓，此即曾姓之始。

二、血脈淵源與宗聖精神

曾氏後人奉孔子弟子曾子（曾參）為宗聖始祖，以「三省堂」、「武城堂」為堂號，傳承「忠恕」家風，代代不輟。

歷史上曾有「曾、邱二姓聯宗」的佳話。原由福建省海澄縣新安鄉邱姓女子與曾氏子弟結緣，導致新安鄉、厚境、清漳等地的邱、曾兩姓實際上同宗一脈，使用相同的輩序昭穆，彼此間不通婚姻。

三、渡台開墾史（新港開基支脈）

明崇禎十五年（1642年），原籍福建省澄邑的曾振賜公渡海來台，開基於台南，為曾氏入台之始。

康熙末年（約1720年），始祖兄弟五人——連公、旺公、龍公、虎公、耄公，原籍福建泉州府同安縣，由連公率領航海東渡來台，落腳雲林口湖一帶，勤耕務農，篳路藍縷，開創基業。

清道光二十五年（1845年），農曆六月初八，雲嘉沿海發生大海嘯（即「萬善同歸」之由來），曾氏族人家屋被大水沖失，死傷慘重。其中曾武六公一家二十七人，竟有二十人罹難，令人哀慟。

咸豐至光緒年間，曾氏族人於新港（今雲林金湖）一帶與吳姓、林姓等發生多次莊頭衝突，並曾遭受中法戰爭時期法國侵台的波及，族人避難保衛家園，歷盡艱辛，展現出極強的凝聚力。

四、龍山派字輩（昭穆）

龍山派為曾氏南遷後極重要的一支，源於福建省泉州府龍山地區（今晉江一帶），字輩詩意優美，強調人文薈萃與家族傳承：

奎壁呈雲瑞，人文煥國華，台衡思繼武，鼎甲勵承家，
一貫書紳永，千秋錫福遐，貽謀資燕翼，世業仰清嘉。

（自第六十六世「奎」字輩起排列，象徵文運亨通、家族棟樑、繼承先志、庇蔭後代。）

五、精神傳承

無論身處何地，曾氏子孫皆以「宗聖曾子弟子」自居，重視「忠恕」家風，以曾子「吾日三省吾身」之精神，勉勵後代修身齊家，承先啟後，永傳家聲。`;

function fretBand(g, x, y, w, h, u, color) {   // 回紋帶

  g.strokeStyle = color; g.lineWidth = Math.max(1.6, u * .12); g.lineCap = 'square';
  const horiz = w >= h, n = Math.ceil((horiz ? w : h) / u) + 1;
  for (let i = 0; i < n; i++) {
    const ox = horiz ? x + i * u : x + (w - u) / 2, oy = horiz ? y + (h - u) / 2 : y + i * u, q = u / 6;
    g.beginPath();
    g.moveTo(ox, oy + u - q); g.lineTo(ox, oy + q); g.lineTo(ox + u - 2 * q, oy + q); g.lineTo(ox + u - 2 * q, oy + u - 2.6 * q);

    g.moveTo(ox, oy + u - q); g.lineTo(ox + u, oy + u - q);

  }
  g.restore();
}

  const parts = lunarFmt.formatToParts(date), m = (parts.find(x => x.type === 'month') || {}).value || '', d = (parts.find(x => x.type === 'day') || {}).value || '';
  return { m: parseInt(m.replace(/\D/g, ''), 10), d: parseInt(d.replace(/\D/g, ''), 10), leap: /閏|bis/i.test(m) };
}
const CN_MON = ['', '正', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '臘'];

    const { date } = twDay(i);
    if (md.lunar) { const l = lunarMD(date); if (!l) return null; if (!l.leap && l.m === md.m && l.d === md.d) return i; }

}

}

/* ---------- 水墨遠山 ---------- */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function ridge(n, rough, seed) {
  const rnd = mulberry32(seed), a = new Array(n).fill(0);
  a[0] = rnd(); a[n - 1] = rnd();
  let step = n - 1, amp = 1;
  while (step > 1) { const h = step / 2; for (let i = h; i < n; i += step) a[i] = (a[i - h] + a[i + h]) / 2 + (rnd() - .5) * amp; amp *= rough; step = h; }
  const mn = Math.min(...a), mx = Math.max(...a); return a.map(v => (v - mn) / (mx - mn));
}
function mountainTexture(seed, alpha) {
  const W = 1024, H = 1024, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  [.22, .5, .8].forEach((f, k) => {
    const pts = ridge(257, .55, seed * 13 + k * 7), base = f * H, hgt = 150 + k * 20, fade = 170;
    g.beginPath(); g.moveTo(0, base + fade);
    pts.forEach((v, i) => g.lineTo(i / (pts.length - 1) * W, base - v * hgt));
    g.lineTo(W, base + fade); g.closePath();
    const gr = g.createLinearGradient(0, base - hgt, 0, base + fade);
    gr.addColorStop(0, `rgba(38,34,30,${alpha})`); gr.addColorStop(.45, `rgba(60,54,46,${alpha * .6})`); gr.addColorStop(1, 'rgba(60,54,46,0)');
    g.fillStyle = gr; g.fill();
  });
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function buildBackdrop(cy) {
  [[-28, .42, 3], [-48, .3, 9], [-75, .2, 21]].forEach(([z, a, seed]) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(220, 220 * .55),
      new THREE.MeshBasicMaterial({ map: mountainTexture(seed, a), transparent: true, depthWrite: false, fog: false }));
    m.position.set(0, cy, z); scene.add(m);
  });
  const sunM = new THREE.Mesh(new THREE.CircleGeometry(5.5, 48),
    new THREE.MeshBasicMaterial({ color: '#c8553d', transparent: true, opacity: .35, depthWrite: false, fog: false }));
  sunM.position.set(-46, cy + 34, -85); scene.add(sunM);
}

/* ---------- 金粉 ---------- */
let dust;
function buildDust(b) {
  const N = 520, pos = new Float32Array(N * 3), sp = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    pos[i * 3] = THREE.MathUtils.lerp(b.minX - 6, b.maxX + 6, Math.random());
    pos[i * 3 + 1] = THREE.MathUtils.lerp(b.minY - 4, b.maxY + 4, Math.random());
    pos[i * 3 + 2] = THREE.MathUtils.lerp(-7, 6, Math.random());
    sp[i] = .15 + Math.random() * .35;
  }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  dust = new THREE.Points(geo, new THREE.PointsMaterial({ size: .09, map: softTex('rgba(255,215,110,1)', 'rgba(210,150,40,0)'),
    transparent: true, depthWrite: false, color: '#e6b84a' }));
  dust.userData = { sp, b }; scene.add(dust);
}

/* ================= 鏡頭 ================= */
let bounds;
function computeBounds() {
  const xs = PEOPLE.map(p => p.x), ys = PEOPLE.map(p => p.y);
  bounds = { minX: Math.min(...xs) - TW, maxX: Math.max(...xs) + TW, minY: Math.min(...ys) - BOT_OFF - .4, maxY: Math.max(...ys) + TOP_OFF + .2 };
  if (plaquePos) { bounds.minX = Math.min(bounds.minX, hallExt.minX); bounds.maxX = Math.max(bounds.maxX, hallExt.maxX); bounds.maxY = Math.max(bounds.maxY, plaquePos.y + .8); }
}
function fitDist(w, h) {
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  return Math.max(h / 2 / t, w / 2 / (t * camera.aspect));
}
function overviewView() {
  const cx = (bounds.minX + bounds.maxX) / 2, cy = (bounds.minY + bounds.maxY) / 2;
  const d = fitDist((bounds.maxX - bounds.minX) * 1.15, (bounds.maxY - bounds.minY) * 1.12);
  return [V(cx + d * .22, cy + d * .06, d), V(cx, cy, 0)];
}
function genView(g) {
  const ps = PEOPLE.filter(p => p.gen === g), xs = ps.map(p => p.x);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2, y = ps[0].y;
  if (g === 1 && plaquePos) {   // 第一世連同匾額、對聯一起入鏡
    const d = Math.max(6.5, fitDist(4.8, 6.6));
    return [V(cx + d * .12, y + .9, d), V(cx, y + .45, 0)];
  }
  const d = Math.max(5.5, fitDist(Math.max(...xs) - Math.min(...xs) + TW + 1.4, GEN_H * .95));
  return [V(cx + d * .14, y + .5, d), V(cx, y + .1, 0)];
}

let flight = null;
const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
function flyTo([pos, tgt], dur = 1.2) {
  if (flight) flight.res();
  return new Promise(res => {
    flight = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: tgt, start: performance.now(), dur: dur * 1000, res };
  });
}

let tourId = 0, touring = false;
async function tour() {
  const my = ++tourId; touring = true;
  await flyTo(genView(1), 1.4);
  for (let g = 1; g <= MAX_GEN; g++) {
    if (my !== tourId) return;
    setGen(g);
    if (g > 1) await flyTo(genView(g), 1.1);
    if (my !== tourId) return;
    await sleep(650);
  }
  if (my !== tourId) return;
  touring = false; setGen(0);
  await flyTo(overviewView(), 1.8);
}

/* 點擊判斷（與拖曳區分） */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; if (touring) stopTour(); if (flight) { flight.res(); flight = null; } });
canvas.addEventListener('pointerup', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t; down = null;
  if (moved > 8 || dt > 450) return;
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  if (!hit) return closeCard();
  const act = hit.object.userData.action;
  if (!act) return selectPerson(hit.object.userData.pid);
  stopTour(); closeCard();
  if (act === 'incense-all') offerIncense('all');
  else if (act === 'altar') { flyTo(altarView(), 1.1); openOfferSheet('all'); }
  else if (act === 'history') openHistory();
  else if (act === 'plaque') openPlaque();
  else if (act.startsWith('zibei')) openZibei(+act.split(':')[1] || 0);
});

function resize() {

/* ================= 動畫迴圈 ================= */
const clock = new THREE.Clock();
const tMin = new THREE.Vector3(), tMax = new THREE.Vector3();
function loop() {
  const dt = Math.min(clock.getDelta(), .05), now = performance.now(), T = now / 1000;

  if (flight) {
    const k = Math.min(1, (now - flight.start) / flight.dur), e = ease(k);
    camera.position.lerpVectors(flight.p0, flight.p1, e);
    controls.target.lerpVectors(flight.t0, flight.t1, e);
    camera.lookAt(controls.target);
    if (k >= 1) { const r = flight.res; flight = null; controls.update(); r(); }
  } else {
    controls.target.clamp(tMin, tMax);
    controls.update();
  }

  if (selected) tablets[selected].front.emissiveIntensity = .18 + .14 * Math.sin(T * 3);
  if (offerObj.candle && offerObj.candle.group.visible) {
    candleFlames.forEach((f, i) => { const k = 1 + Math.sin(T * 17 + i * 3) * .08 + Math.sin(T * 7.3 + i) * .06; f.scale.set(.09 * k, .17 * (2 - k), 1); });
    candleLight.intensity = 1.5 + Math.sin(T * 13) * .15 + Math.sin(T * 5.1) * .1;
  }
  for (const k in offerObj) { const g = offerObj[k].group; if (g.visible && g.scale.x < .999) g.scale.setScalar(Math.min(1, g.scale.x + dt * 2.2)); else if (!g.visible) g.scale.setScalar(.01); }
  if (steleFront) { steleFront.emissiveIntensity = .05 + .04 * Math.sin(T * 1.3); steleHalo.material.opacity = .42 + .12 * Math.sin(T * 1.3); }
  for (const id in tablets) {
    const t = tablets[id], goal = t.flip * Math.PI;
    if (id !== selected) {
      let e = 0;
      if (t.memorial) e = .22 + .16 * Math.sin(T * 2);
      if (t.offerGlow) { const k = (now - t.offerGlow) / 3000; if (k < 1) e = Math.max(e, .5 * (1 - k)); else t.offerGlow = 0; }
      t.front.emissiveIntensity = e;
    }
    if (t.aura) t.aura.material.opacity = .45 + .2 * Math.sin(T * 2);
    if (Math.abs(t.grp.rotation.y - goal) > .001) t.grp.rotation.y += (goal - t.grp.rotation.y) * Math.min(1, dt * 5);
    if (t.sway !== undefined) t.grp.rotation.z = Math.sin(T * .9 + t.sway) * .025;
  }

  if (dust) {
    const a = dust.geometry.attributes.position, { sp, b } = dust.userData;
    for (let i = 0; i < sp.length; i++) {
      let y = a.getY(i) + sp[i] * dt;
      if (y > b.maxY + 4) y = b.minY - 4;
      a.setY(i, y); a.setX(i, a.getX(i) + Math.sin(T * .6 + i) * .002);
    }
    a.needsUpdate = true;
  }
  for (let k = emitters.length - 1; k >= 0; k--) {
    const e = emitters[k];
    if (e.until && now > e.until) {
      e.sprites.forEach(sp => { scene.remove(sp); sp.material.dispose(); });
      if (e.group) scene.remove(e.group);
      emitters.splice(k, 1); continue;
    }
    const fadeIn = Math.min(1, (now - e.born) / 1500), fadeOut = e.until ? Math.min(1, (e.until - now) / 4000) : 1;
    e.sprites.forEach(sp => {
      const t = (sp.userData.t + T * .12) % 1;
      sp.position.set(e.pos.x + Math.sin(t * 9 + sp.userData.t * 20) * .15 * t * e.sz, e.pos.y + t * e.h, e.pos.z - t * .3 * e.sz);
      sp.scale.setScalar((.15 + t * .9) * e.sz);
      sp.material.opacity = Math.sin(t * Math.PI) * .55 * fadeIn * fadeOut;
    });
  }

  renderer.render(scene, camera);
}

/* ================= 啟動 ================= */
async function start() {
  const introT0 = performance.now();
  const riteP = loadRite();
  await waitFonts();
  PEOPLE.forEach(buildTablet);
  buildLines();
  buildAltar();
  buildHall();
  computeBounds();
  buildBackdrop((bounds.minY + bounds.maxY) / 2);
  buildDust(bounds);
  buildBar();
  computeAnniv();
  tMin.set(bounds.minX - 4, bounds.minY - 4, -3); tMax.set(bounds.maxX + 4, bounds.maxY + 4, 3);
  if (towerHall) { tMax.x = towerHall.x + 4; tMin.y = Math.min(tMin.y, towerHall.bottom - 2); }

  const [p0, t0] = genView(1);
  camera.position.copy(p0).add(V(0, 4, 6)); controls.target.copy(t0); camera.lookAt(t0);
  renderer.setAnimationLoop(loop);
  window.__zupuReady = true;

  const intro = document.getElementById('intro');
  let skipped = false;
  const todayAnniv = ANNIV.find(a => a.days === 0);
  riteP.then(() => { refreshOfferings(); showRiteBanner(); if (selected) openCard(byId[selected]); });
  intro.addEventListener('pointerdown', () => {
    if (skipped) return; skipped = true; intro.classList.add('hide');
    stopTour();
    if (todayAnniv) selectPerson(todayAnniv.p.id); else flyTo(overviewView(), 1.2);
  });
  await sleep(Math.max(0, 2600 - (performance.now() - introT0)));
  if (skipped) return;
  intro.classList.add('hide'); skipped = true;
  if (todayAnniv) { await flyTo(genView(1), 1.4); selectPerson(todayAnniv.p.id); }   // 忌日當天：直接帶到該位祖先
  else tour();
}
start();
